name: storkia_mobile_courier
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/s-express_2.png"
  adaptive_icon_background: "#FAFAFA"
  adaptive_icon_foreground: "assets/s-express_2.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#FAFAFA"
  image: " assets/s-express_2.png"
  android_12:
    image: " assets/s-express_2.png"
    color: "#FAFAFA"

flutter:
  uses-material-design: true

  assets:
    - assets/s-express_2.png
    - assets/s-express-launcher.png
    - assets/pink-storkia-maximized.webp
    - assets/s-express-foreground.png
    - assets/s-express.png
